services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cl_pg
    environment:
      POSTGRES_USER: cl
      POSTGRES_PASSWORD: cl_dev_password
      POSTGRES_DB: continue_leads
    ports:
      - "15432:5432"
    volumes:
      - cl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cl -d continue_leads"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cl_pgdata:
